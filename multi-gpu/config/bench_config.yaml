# Multi-GPU Tensor Parallelism & Serving Benchmark Configuration

# Default Model Configuration
model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  # Alternative lightweight options:
  # name: "Qwen/Qwen2.5-7B-Instruct"
  # name: "mistralai/Mistral-7B-Instruct-v0.3"
  dtype: "bfloat16"
  max_model_len: 8192

# Server Configuration
server:
  host: "127.0.0.1"
  port: 8000
  gpu_memory_utilization: 0.90
  max_num_seqs: 256

# Experiment 1: TP Scaling Sweep (TP=1 vs TP=2)
tp_sweep:
  tensor_parallel_sizes: [1, 2]
  # Concurrency (virtual clients) sweep to test decode throughput & ITL scaling
  concurrency_levels: [1, 2, 4, 8, 16, 32, 64]
  # Fixed tokens for decode scaling test
  fixed_prompt_tokens: 512
  fixed_output_tokens: 128

# Experiment 2: Prefill Scaling (TTFT vs Prompt Length)
prefill_sweep:
  prompt_lengths: [128, 512, 1024, 2048, 4096]
  output_tokens: 1
  concurrency: 1  # Isolate prefill compute time without queueing

# Experiment 3: Prefix Caching Multi-GPU Comparison (vLLM APC vs SGLang RadixAttention)
prefix_caching_sweep:
  shared_prefix_lengths: [512, 1024, 2048]
  unique_query_length: 128
  output_tokens: 128
  num_requests: 100
  shared_system_prompt_ratio: 0.8  # 80% share the same system context
  engines:
    - name: "vllm"
      enable_prefix_caching: true
    - name: "sglang"
      enable_radix_cache: true

# Nsight Systems Profiling Settings
nsys_profile:
  warmup_requests: 5
  profile_requests: 10
  trace_flags: "cuda,nvtx,osrt,cublas"
  cuda_memory_usage: true
  output_dir: "benchmarks/nsys_traces"
